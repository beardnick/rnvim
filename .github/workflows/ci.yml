name: ci

on:
  push:
    branches: [master]
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Neovim
        uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: stable
      - name: Lua unit tests
        run: nvim --headless --clean --cmd "set rtp+=." -l tests/unit_spec.lua
      - name: Build agent
        run: cargo build -p rnvim-agent
      - name: E2e scenarios
        run: |
          for spec in tests/e2e/*_spec.lua; do
            echo "== $spec"
            E2E_HOME=$(mktemp -d)
            HOME="$E2E_HOME" RNVIM_AGENT_BIN="$PWD/target/debug/rnvim-agent" \
              nvim --headless --clean --cmd "set rtp+=." -l "$spec"
            rm -rf "$E2E_HOME"
          done
