# Release train: every tag builds the full binary for every supported
# platform. The linux musl builds double as the agents that `rnvim` deploys
# to remote machines (fetched locally from this release, pushed over ssh —
# remotes never need GitHub access).

name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            use-cross: true
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Install musl tools
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Install cross
        if: matrix.use-cross
        uses: taiki-e/install-action@v2
        with:
          tool: cross
      - name: Build
        run: |
          if [ "${{ matrix.use-cross }}" = "true" ]; then
            cross build --release --target ${{ matrix.target }} -p rnvim
          else
            cargo build --release --target ${{ matrix.target }} -p rnvim
          fi
      - name: Stage artifact
        run: cp target/${{ matrix.target }}/release/rnvim rnvim-${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: rnvim-${{ matrix.target }}
          path: rnvim-${{ matrix.target }}
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - run: sha256sum rnvim-* > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            rnvim-*
            SHA256SUMS
          generate_release_notes: true
