[workspace]
resolver = "2"
members = ["crates/rnvim", "crates/rnvim-proto", "crates/rnvim-agent"]

[workspace.package]
version = "0.9.5"
edition = "2021"
license = "MIT"
repository = "https://github.com/beardnick/rnvim"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
include_dir = "0.7"
tempfile = "3"
ureq = { version = "2", features = ["tls"] }

rnvim-proto = { path = "crates/rnvim-proto" }
rnvim-agent = { path = "crates/rnvim-agent" }

[profile.release]
strip = true
lto = true
